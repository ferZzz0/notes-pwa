<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: в установленном приложении рисуем под вырезом и
       «домашней полоской» iPhone, отступы задаём через env(safe-area-inset-*).
       maximum-scale=1: iOS не приближает страницу, когда открывается поле
       ввода (приближает лист само приложение) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Заметочки — устанавливаемое приложение, работает офлайн" />
  <!-- Название под иконкой на главном экране iPhone (просьба автора) -->
  <meta name="apple-mobile-web-app-title" content="Заметочки" />
  <!-- Цвет строки состояния и заголовка окна, отдельно для светлой и тёмной темы -->
  <meta name="theme-color" content="#fffdf6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#e4ddcd" media="(prefers-color-scheme: dark)" />
  <title>Заметочки</title>

  <!-- Иконки генерирует `npm run icons` из public/icon.svg.
       Ссылку на манифест PWA добавляет в сборку vite-plugin-pwa. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
