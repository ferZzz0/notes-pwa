<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Исходник иконки приложения. После правок запусти `npm run icons`,
       чтобы перегенерировать PNG и favicon.ico рядом с этим файлом. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc15e"/>
      <stop offset="1" stop-color="#f28a2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Лист заметки, чуть повёрнут. Всё важное лежит в круге радиусом 40%
       от центра — эту зону не обрезает ни одна маска (maskable-иконки). -->
  <g transform="rotate(-6 256 256)">
    <path d="M150 122 h170 l62 62 v206 a20 20 0 0 1 -20 20 h-212 a20 20 0 0 1 -20 -20 v-248 a20 20 0 0 1 20 -20 z"
          fill="#7a3a00" opacity="0.18"/>
    <path d="M150 112 h170 l62 62 v206 a20 20 0 0 1 -20 20 h-212 a20 20 0 0 1 -20 -20 v-248 a20 20 0 0 1 20 -20 z"
          fill="#fffdf8"/>
    <path d="M320 112 v42 a20 20 0 0 0 20 20 h42 z" fill="#f3dfbf"/>
    <rect x="168" y="208" width="140" height="18" rx="9" fill="#e7ad62"/>
    <rect x="168" y="258" width="176" height="18" rx="9" fill="#efc890"/>
    <rect x="168" y="308" width="124" height="18" rx="9" fill="#efc890"/>
  </g>
</svg>
