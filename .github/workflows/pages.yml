# Публикация на GitHub Pages: при каждом push в main сборка (как локально:
# проверка типов и vite build) и выкладка dist/ на notes-polik.sokolovpk.ru.
# Свой домен задан в настройках репозитория (Settings → Pages), а в DNS у
# Cloudflare на него — CNAME на ferzzz0.github.io без прокси.
# Раньше сайт раздавал Cloudflare, но российские провайдеры обрывают часть
# его адресов (CLAUDE.md, README).
name: GitHub Pages

on:
  push:
    branches: [main]
  # Запустить вручную: Actions → GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз; начатую не обрываем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # На незнакомые пути GitHub Pages отдаёт 404.html — пусть это будет
      # само приложение
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
